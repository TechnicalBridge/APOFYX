# =============================================================================
#  APOFYX — entorno de desarrollo
# =============================================================================
#  Uso habitual (solo la base de datos):
#      docker compose up -d
#      docker compose logs -f db          # ver el arranque
#      docker compose down                # detener, conservando los datos
#      docker compose down -v             # detener Y BORRAR los datos
#
#  Para levantar tambien la aplicacion Django en su contenedor:
#      docker compose --profile app up -d --build
#
#  La base queda expuesta en el puerto 3307 del host, NO en el 3306, para que
#  no choque con el MySQL 8.4 que ya esta instalado en el equipo.
#  Conexion desde MySQL Workbench:  127.0.0.1 : 3307
# =============================================================================

services:

  db:
    image: mysql:8.4
    container_name: apofyx-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-apofyx}
      MYSQL_USER:          ${MYSQL_USER:-apofyx_app}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-apofyx_pass}

    # utf8mb4 explicito: el esquema y los datos llevan acentos y enies.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    ports:
      - "${MYSQL_PORT:-3307}:3306"

    volumes:
      # Datos persistentes. Sobreviven a "docker compose down".
      - apofyx_db_data:/var/lib/mysql
      # El script se ejecuta SOLO la primera vez, cuando el volumen esta vacio.
      # Para volver a cargarlo hay que hacer "docker compose down -v".
      - ./sql/AphofyxDB.sql:/docker-entrypoint-initdb.d/01-AphofyxDB.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ---------------------------------------------------------------------------
  #  Aplicacion Django.
  #  Esta bajo el perfil "app" a proposito: para programar se levanta solo la
  #  base y el runserver corre en la maquina, que recarga al guardar. La
  #  aplicacion en contenedor es para desplegarla o para probarla entera en un
  #  equipo que no tiene nada instalado:
  #      docker compose --profile app up -d --build
  # ---------------------------------------------------------------------------
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: apofyx/web:1.0.0
    container_name: apofyx-web
    restart: unless-stopped

    environment:
      # Dentro de la red de compose el host de la base es "db" y el puerto 3306,
      # no el 3307 que se publica hacia afuera.
      DB_HOST:     db
      DB_PORT:     3306
      DB_NAME:     ${MYSQL_DATABASE:-apofyx}
      DB_USER:     ${MYSQL_USER:-apofyx_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-apofyx_pass}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-inseguro-cambiar}
      # Variable propia, y no DJANGO_DEBUG: el .env de desarrollo dice 1 y
      # compose lo lee solo, asi que el contenedor terminaba mostrando la
      # traza completa en cada error. Aca manda el 0 salvo que se pida otra
      # cosa explicitamente.
      DJANGO_DEBUG:      ${DJANGO_DEBUG_DOCKER:-0}
      GEMINI_API_KEY:    ${GEMINI_API_KEY:-}
      # Si estan, el arranque crea el superusuario del panel. Si no, no.
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      # La misma clave que trae .env.example: quien copie la plantilla y
      # quien no tenga .env entran con la misma.
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-apofyx2026}
      DJANGO_SUPERUSER_EMAIL:    ${DJANGO_SUPERUSER_EMAIL:-admin@apofyx.cl}
      # La cadena con DataBridge, apagada mientras no haya credenciales.
      DATABRIDGE_URL:             ${DATABRIDGE_URL:-}
      DATABRIDGE_CLAVE:           ${DATABRIDGE_CLAVE:-}
      DATABRIDGE_SECRETO_EVENTOS: ${DATABRIDGE_SECRETO_EVENTOS:-}
      # La cartera de Patrimonio de la demo (manage.py cargar_demo). Solo
      # entra si Patrimonio no tiene cartera todavia. false para partir sin ella.
      DEMO_DATOS: ${DEMO_DATOS:-true}

    ports:
      - "${WEB_PORT:-8000}:8000"

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # El arranque espera a la base, migra y junta los estaticos antes de
      # servir: hay que darle tiempo antes de declararlo enfermo.
      start_period: 90s

    deploy:
      resources:
        limits: { memory: 512M }

    depends_on:
      db:
        condition: service_healthy

volumes:
  apofyx_db_data:
