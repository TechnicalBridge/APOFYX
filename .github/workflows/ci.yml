# El arnés de verificación vuelve a la CI cuando DataBridge esté terminado: hoy el
# sitio está a medio reescribir y una línea base tomada ahora congelaría páginas en
# obra. Mientras tanto quedan linter, formato, tests y compilación.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run tipos

      - name: Linter
        run: npm run lint

      - name: Formato
        run: npm run formato

      - name: Tests
        run: npm test

      # El prerender y el arnés necesitan un navegador de verdad. El runner de
      # GitHub ya trae Chrome instalado; sólo hay que decirle dónde está.
      - name: Compilar y prerenderizar
        run: npm run build
        env:
          CHROME_PATH: /usr/bin/google-chrome
