name: CI

on:
  push:
  pull_request:

#  Solo lectura: ningun paso necesita escribir en el repositorio.
permissions:
  contents: read

jobs:
  django:
    name: Esquema y pruebas
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: apofyx
      # root, porque las pruebas crean y borran su propia base (test_apofyx).
      DB_USER: root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      #  Ninguna clave escrita en el repositorio: cada corrida inventa las
      #  suyas, y GitHub las tapa en el registro.
      - name: Claves de esta corrida
        run: |
          for variable in DB_PASSWORD CLAVE_APOFYX_APP DJANGO_SECRET_KEY CIFRADO_LLAVE; do
            valor=$(openssl rand -base64 48 | tr -d '\n/+=')
            echo "::add-mask::$valor"
            echo "$variable=$valor" >> "$GITHUB_ENV"
          done

      # El mismo motor que en desarrollo: MySQL 8.4, con la clave de esta
      # corrida. Va con docker run y no como servicio del job: un servicio
      # arranca antes que los pasos y no puede usar una clave que se invento
      # en uno de ellos.
      - name: MySQL 8.4
        run: |
          #  El usuario de la aplicacion tambien: el DDL le da permisos.
          docker run -d --name mysql -e MYSQL_ROOT_PASSWORD -e MYSQL_DATABASE=apofyx -e MYSQL_USER=apofyx_app -e MYSQL_PASSWORD -p 3306:3306 mysql:8.4
          for intento in $(seq 1 60); do
            if docker exec -e MYSQL_PWD mysql mysqladmin ping -h 127.0.0.1 -uroot --silent; then exit 0; fi
            sleep 2
          done
          echo "MySQL no respondio" >&2
          exit 1
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_PASSWORD: ${{ env.CLAVE_APOFYX_APP }}
          MYSQL_PWD: ${{ env.DB_PASSWORD }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Librerias de MySQL para mysqlclient
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: pip install -r requirements.txt

      # Lo que haria alguien que clona el repo: la base nace del DDL y Django la
      # adopta. Si una migracion posterior intentara crear algo que el DDL ya
      # trae, este paso se cae (para eso esta SiFalta, en crm/operaciones.py).
      - name: La base nace de sql/AphofyxDB.sql
        run: mysql -h 127.0.0.1 -uroot --default-character-set=utf8mb4 < sql/AphofyxDB.sql
        env:
          MYSQL_PWD: ${{ env.DB_PASSWORD }}
      - name: Y Django la adopta
        run: python manage.py migrate --fake-initial

      - run: python manage.py check
      - run: python manage.py test --noinput

  seguridad:
    name: Dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      # pip-audit resuelve las dependencias con pip para auditar tambien las
      # transitivas (asgiref, sqlparse...), y para eso tiene que armar cada
      # paquete. mysqlclient no trae rueda para Linux: se compila, y sin estas
      # librerias la auditoria se cae antes de auditar nada.
      - name: Librerias de MySQL para mysqlclient
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      # Rompe el build si una dependencia tiene una vulnerabilidad conocida.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
