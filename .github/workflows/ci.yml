name: CI

on:
  push:
  pull_request:

jobs:
  django:
    name: Esquema y pruebas
    runs-on: ubuntu-latest

    # El mismo motor que en desarrollo: MySQL 8.4.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: apofyx
          MYSQL_USER: apofyx_app
          MYSQL_PASSWORD: apofyx_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: apofyx
      # root, porque las pruebas crean y borran su propia base (test_apofyx).
      DB_USER: root
      DB_PASSWORD: rootpass

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Librerias de MySQL para mysqlclient
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: pip install -r requirements.txt

      # Lo que haria alguien que clona el repo: la base nace del DDL y Django la
      # adopta. Si una migracion posterior intentara crear algo que el DDL ya
      # trae, este paso se cae (para eso esta SiFalta, en crm/operaciones.py).
      - name: La base nace de sql/AphofyxDB.sql
        run: mysql -h 127.0.0.1 -uroot -prootpass --default-character-set=utf8mb4 < sql/AphofyxDB.sql
      - name: Y Django la adopta
        run: python manage.py migrate --fake-initial

      - run: python manage.py check
      - run: python manage.py test --noinput

  seguridad:
    name: Dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # pip-audit resuelve las dependencias con pip para auditar tambien las
      # transitivas (asgiref, sqlparse...), y para eso tiene que armar cada
      # paquete. mysqlclient no trae rueda para Linux: se compila, y sin estas
      # librerias la auditoria se cae antes de auditar nada.
      - name: Librerias de MySQL para mysqlclient
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      # Rompe el build si una dependencia tiene una vulnerabilidad conocida.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
